[workspace]
members = [
    "crates/logika",
    "crates/logika-cli",
    "crates/logika-core",
    "crates/logika-plugin-api",
    "crates/logika-plugin-host",
    "crates/logika-registry",
    "crates/logika-runtime",
    "crates/logika-sdk",
    "crates/logika-sdk-macros",
    "crates/logika-store",
    "crates/logika-testkit",
    "crates/logika-workflow",
    "examples/typed_workflow",
]
default-members = [
    "crates/logika",
    "crates/logika-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/aviancode/logika"
homepage = "https://github.com/aviancode/logika"

[workspace.dependencies]
logika = { path = "crates/logika", version = "0.1.0" }
logika-core = { path = "crates/logika-core", version = "0.1.0" }
logika-plugin-api = { path = "crates/logika-plugin-api", version = "0.1.0" }
logika-plugin-host = { path = "crates/logika-plugin-host", version = "0.1.0" }
logika-registry = { path = "crates/logika-registry", version = "0.1.0" }
logika-runtime = { path = "crates/logika-runtime", version = "0.1.0" }
logika-sdk = { path = "crates/logika-sdk", version = "0.1.0" }
logika-sdk-macros = { path = "crates/logika-sdk-macros", version = "0.1.0" }
logika-store = { path = "crates/logika-store", version = "0.1.0" }
logika-testkit = { path = "crates/logika-testkit", version = "0.1.0" }
logika-workflow = { path = "crates/logika-workflow", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
