[workspace]
members = [
    "crates/orbita",
    "crates/orbita-cli",
    "crates/orbita-core",
    "crates/orbita-plugin-api",
    "crates/orbita-plugin-host",
    "crates/orbita-registry",
    "crates/orbita-runtime",
    "crates/orbita-sdk",
    "crates/orbita-sdk-macros",
    "crates/orbita-store",
    "crates/orbita-testkit",
    "crates/orbita-workflow",
    "examples/typed_workflow",
]
default-members = [
    "crates/orbita",
    "crates/orbita-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
orbita = { path = "crates/orbita", version = "0.1.0" }
orbita-core = { path = "crates/orbita-core", version = "0.1.0" }
orbita-plugin-api = { path = "crates/orbita-plugin-api", version = "0.1.0" }
orbita-plugin-host = { path = "crates/orbita-plugin-host", version = "0.1.0" }
orbita-registry = { path = "crates/orbita-registry", version = "0.1.0" }
orbita-runtime = { path = "crates/orbita-runtime", version = "0.1.0" }
orbita-sdk = { path = "crates/orbita-sdk", version = "0.1.0" }
orbita-sdk-macros = { path = "crates/orbita-sdk-macros", version = "0.1.0" }
orbita-store = { path = "crates/orbita-store", version = "0.1.0" }
orbita-testkit = { path = "crates/orbita-testkit", version = "0.1.0" }
orbita-workflow = { path = "crates/orbita-workflow", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
