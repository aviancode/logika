[package]
name = "orbita"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Embedded workflow engine facade"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
# The `orbita` package name belongs to an unrelated project on crates.io.
publish = false

[features]
default = ["core", "workflow", "sdk", "registry", "store"]
full = ["core", "workflow", "sdk", "registry", "store"]
core = ["dep:orbita-core"]
workflow = ["dep:orbita-workflow"]
sdk = ["dep:orbita-sdk"]
registry = ["dep:orbita-registry"]
store = ["dep:orbita-store"]

[dependencies]
orbita-core = { workspace = true, optional = true }
orbita-registry = { workspace = true, optional = true }
orbita-sdk = { workspace = true, optional = true }
orbita-store = { workspace = true, optional = true }
orbita-workflow = { workspace = true, optional = true }

[dev-dependencies]
semver = "1"

[lints]
workspace = true
