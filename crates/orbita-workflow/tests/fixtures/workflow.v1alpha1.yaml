apiVersion: orbita.dev/v1alpha1
kind: Workflow
metadata:
  name: enrich-order
  version: 1.0.0
spec:
  inputs:
    order: acme.order@1
  nodes:
    - id: validate
      uses: acme.validation/order@^1.2
      config:
        strict: true
  edges:
    - from: $inputs.order
      to: validate.order
  outputs:
    validated_order: validate.valid_order
