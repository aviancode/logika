apiVersion: logika.dev/v1
kind: Workflow
metadata:
  name: validate-order
  version: 1.0.0
spec:
  inputs:
    order: acme.order@1
  nodes:
    - id: validate
      uses: acme.validation/validate-order@^1.2
  edges:
    - from: $inputs.order
      to: validate.order
  outputs:
    validated: validate.validated
