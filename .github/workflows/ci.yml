name: CI

on:
  pull_request:
  push:
    branches: [develop, main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  lint:
    name: Lint and documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          components: clippy,rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc --workspace --no-deps

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
      - run: cargo test --workspace --all-targets --all-features

  publish:
    name: Publish crates.io packages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test]
    runs-on: ubuntu-latest
    concurrency:
      group: crates-io-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          workspace_version="$(
            cargo metadata --no-deps --format-version 1 |
              jq -r '.packages[] | select(.name == "logika-core") | .version'
          )"
          if [[ "$GITHUB_REF_NAME" != "v$workspace_version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match workspace version $workspace_version" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Publish workspace crates
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          is_published() {
            cargo info --registry crates-io "$1@$RELEASE_VERSION" >/dev/null 2>&1
          }

          wait_until_published() {
            local crate="$1"
            for attempt in {1..30}; do
              if is_published "$crate"; then
                return 0
              fi
              echo "waiting for $crate@$RELEASE_VERSION in the crates.io index ($attempt/30)"
              sleep 10
            done
            echo "$crate@$RELEASE_VERSION did not appear in the crates.io index" >&2
            return 1
          }

          publish_crate() {
            local crate="$1"
            local delay
            local publish_output
            if is_published "$crate"; then
              echo "$crate@$RELEASE_VERSION is already published; skipping"
              return 0
            fi

            for attempt in {1..6}; do
              if publish_output="$(
                cargo publish --registry crates-io --package "$crate" 2>&1
              )"; then
                printf '%s\n' "$publish_output"
                wait_until_published "$crate"
                return 0
              fi

              printf '%s\n' "$publish_output" >&2
              if [[ "$publish_output" != *"429 Too Many Requests"* ]]; then
                return 1
              fi
              if (( attempt == 6 )); then
                break
              fi

              delay=$((attempt * 60))
              echo "crates.io rate limit hit for $crate; retrying in ${delay}s ($attempt/6)"
              sleep "$delay"

              if is_published "$crate"; then
                return 0
              fi
            done

            echo "unable to publish $crate@$RELEASE_VERSION after rate-limit retries" >&2
            return 1
          }

          # Keep this list in dependency order. Waiting after every upload makes
          # reruns safe and lets Cargo resolve newly published path dependencies.
          crates=(
            logika-core
            logika-sdk-macros
            logika-workflow
            logika-registry
            logika-sdk
            logika-store
            logika-cli
            logika
          )

          for crate in "${crates[@]}"; do
            publish_crate "$crate"
          done
